[package]
name = "grpc-xds"
version = "0.1.0-alpha.1"
authors = ["gRPC authors"]
license = "MIT"
homepage = "https://grpc.io"
repository = "https://github.com/grpc/grpc-rust"
description = """
xDS routing and load balancing for the Rust gRPC implementation.
"""
edition = "2024"
rust-version.workspace = true
# Not published yet: the build.rs codegen requires protoc (and a C++ build of
# `protoc-gen-grpc-rust`), which doesn't fit docs.rs / crates.io publishing.
publish = false

[package.metadata.cargo_check_external_types]
allowed_external_types = []

[dependencies]
protobuf = "4.36.2-release"
protobuf-well-known-types = "0.36.2-release"
bytes = "1.11.0"
grpc = { version = "0.10.0", path = "../grpc", default-features = false, features = ["__unstable"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
xds-client = { version = "0.1.0-alpha.4", path = "../xds-client", default-features = false }
regex = "1"

[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
protobuf-codegen = "4.36.2-release"
protobuf-well-known-types = "0.36.2-release"
protoc-gen-grpc-rust = { version = "0.10.0", path = "../protoc-gen-grpc-rust" }
