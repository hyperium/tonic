[package]
name = "grpc"
version = "0.10.0"
authors = ["gRPC authors"]
license = "MIT"
homepage = "https://grpc.io"
repository = "https://github.com/grpc/grpc-rust"
description = """
The official Rust implementation of gRPC: a high performance, open source, universal RPC framework.
"""
readme = "README.md"
keywords = ["rpc", "grpc", "async", "protobuf", "proto"]
categories = ["web-programming", "network-programming", "asynchronous"]
rust-version = { workspace = true }
edition = "2024"

[lints.clippy]
elidable_lifetime_names = "deny"
semicolon_if_nothing_returned = "deny"
unnecessary_semicolon = "deny"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "async_trait::async_trait",
    "bytes::*",
    "tonic::*",
    "tokio::sync::oneshot::*",
]

[features]
default = ["dns", "_runtime-tokio", "tls-rustls"]
dns = ["dep:hickory-resolver", "_runtime-tokio"]
# The following feature is used to ensure all modules use the runtime
# abstraction instead of using tokio directly.
# Using tower/buffer enables tokio's rt feature even though it's possible to
# create Buffers with a user provided executor.
_runtime-tokio = [
    "tokio/rt",
    "tokio/net",
    "tokio/time",
    "dep:socket2",
    "dep:tower",
]
# Used for testing with udeps as it wants this feature to exist
# to be able to do its checks.
tower = ["_runtime-tokio"]
tls-rustls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:rustls-platform-verifier",
    "dep:rustls-webpki",
]
__unstable = []
gzip = ["dep:flate2"]

[dependencies]
base64 = "0.22"
bytes = "1.10.1"
flate2 = { version = "1.0", optional = true, default-features = false, features = [
    "zlib-rs",
] }
hickory-resolver = { version = "0.26.1", optional = true }
http = "1.1.0"
httparse = "1.9"
http-body = "1.0.1"
hyper = { version = "1.6.0", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client-proxy"] }
itoa = "1.0"
parking_lot = "0.12.4"
percent-encoding = "2.3"
pin-project-lite = "0.2.16"
rand = "0.10"
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "tls12",
    "logging",
    "std",
] }
rustls-pemfile = { version = "2.1", optional = true, default-features = false, features = [
    "std",
] }
rustls-pki-types = { version = "1.8", optional = true, default-features = false }
rustls-platform-verifier = { version = "0.7", optional = true, default-features = false }
rustls-webpki = { version = "0.103", optional = true, default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
socket2 = { version = "0.6", optional = true }
tokio = { version = "1.37.0", features = ["sync", "macros"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false }
tokio-stream = { version = "0.1.17", default-features = false }
tonic = { version = "0.14.6", path = "../tonic", default-features = false, features = [
    "codegen",
    "h2",
] }
tower = { version = "0.5.2", features = [
    "limit",
    "util",
    "buffer",
], optional = true }
tower-service = "0.3.3"
trait-variant = "0.1.2"
url = "2.5.0"

[dev-dependencies]
h2 = "0.4"
tokio = { version = "1.37.0", features = ["test-util"] }
async-stream = "0.3.6"
criterion = "0.8"
hickory-server = "0.26.1"
prost = "0.14.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tempfile = "3.26"
tonic = { version = "0.14.6", path = "../tonic", default-features = false, features = [
    "server",
    "router",
    "tls-ring",
] }
tonic-prost = { version = "0.14.6", path = "../tonic-prost" }

[[bench]]
name = "metadata"
harness = false

[[bench]]
name = "call_attributes"
harness = false
