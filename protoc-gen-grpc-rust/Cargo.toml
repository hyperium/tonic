[package]
name = "protoc-gen-grpc-rust"
version = "0.10.0"
authors = ["gRPC authors"]
license = "MIT"
homepage = "https://grpc.io"
repository = "https://github.com/grpc/grpc-rust"
description = "Protobuf plugin to generate gRPC-Rust service bindings"
readme = "README.md"
keywords = ["rpc", "grpc", "async", "protobuf", "proto"]
categories = ["web-programming", "network-programming", "asynchronous"]
rust-version = { workspace = true }
edition = "2024"
# We do want to publish, but semver CI gets angry because it doesn't exist yet.
# So we'll enable this just before we publish the first time.
publish = false

[dependencies]

[build-dependencies]
cmake = "0.1"
